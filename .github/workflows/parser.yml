name: NHL News Watcher

on:
  schedule:
    # Запускаем каждые 15 минут для оперативного контроля
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  watch-and-parse:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install basic dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright

      - name: Install Playwright browsers (Chromium)
        run: playwright install chromium

      - name: Run Watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python watcher.py

      - name: Commit and push updated database
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update sent_news.db [skip ci]"
          file_pattern: "sent_news.db"
          add_options: '-f'
