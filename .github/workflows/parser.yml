name: NHL News Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-watcher]

jobs:
  check-news:
    runs-on: ubuntu-latest
    outputs:
      new_news: ${{ steps.watcher-step.outputs.new_news }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Lightweight Watcher
        id: watcher-step
        run: |
          # Запускаем watcher.py и записываем результат (true/false) в output
          python watcher.py

  run-parser:
    needs: check-news
    # Запускаем тяжелый парсер ТОЛЬКО если watcher нашел новую новость!
    if: needs.check-news.outputs.new_news == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install heavy dependencies (Playwright)
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Run Heavy Parser
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python pars.py

      - name: Commit and push updated database
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update sent_news.db [skip ci]"
          file_pattern: "sent_news.db"
          add_options: '-f'
          push_options: '--force'
