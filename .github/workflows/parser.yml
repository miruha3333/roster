name: NHL News Watcher & Parser

on:
  schedule:
    # Запуск каждый час (watcher проверяет наличие новостей)
    - cron: '0 * * * *'
  workflow_dispatch: # Кнопка ручного запуска на сайте

jobs:
  check-and-parse:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Run watcher and parser
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python pars.py

      - name: Commit and push updated database
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update sent_news.db [skip ci]"
          file_pattern: "sent_news.db"
          add_options: '-f'
