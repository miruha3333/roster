name: DailyFaceoff Auto-Poster

on:
  schedule:
    # Запуск каждые 20 минут
    - cron: '*/20 * * * *'
  # Возможность запустить вручную кнопкой в GitHub
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          pip install -r requirements.txt

      - name: Запуск парсера
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python main.py

      - name: Сохранение базы данных в репозиторий
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add news.db
          git diff --staged --quiet || (git commit -m "chore: обновить базу данных новостей" && git push)
